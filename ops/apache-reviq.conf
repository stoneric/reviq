# Include inside both existing reviq.xyz VirtualHost blocks.
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://reviq.xyz%{REQUEST_URI} [R=301,L]

ProxyPreserveHost On
RequestHeader set X-Reviq-Client-IP "expr=%{REMOTE_ADDR}"
ProxyPass /api/ http://127.0.0.1:8088/api/ connectiontimeout=5 timeout=65
ProxyPassReverse /api/ http://127.0.0.1:8088/api/
SetEnvIf Request_URI "^/api/" no-gzip=1

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

<Directory /var/www/reviq.xyz/web>
    DirectoryIndex index.html
    Options -Indexes
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.html [L]
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
